---
- name: apt update && apt upgrade
  hosts: "vms:lxcs"
  become: true
  tasks:
    - name: apt
      apt:
        update_cache: yes
        upgrade: yes

    # Check if reboot is required
    - name: check if system reboot is required
      become: true
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    # Output message when reboot is required
    - name: debug message if output is required
      ansible.builtin.debug:
        msg: "REBOOT_REQUIRED:{{ inventory_hostname }}"
      when: reboot_required.stat.exists
