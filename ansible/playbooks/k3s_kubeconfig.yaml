---
- name: Fetch k3s kubeconfig to Ansible control node
  hosts: localhost
  vars:
    # lb_ip lives in group_vars/vm_k3s.yml, which does not apply to localhost.
    lb_ip: "{{ hostvars['k3s-master1'].lb_ip }}"
    k3s_master: k3s-master1
  tasks:
    - name: Fetch k3s kubeconfig from first master
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ k3s_master }}"
      register: k3s_kubeconfig_b64
      check_mode: no

    - name: Write local k3s kubeconfig
      ansible.builtin.copy:
        content: "{{ k3s_kubeconfig_b64.content | b64decode | regex_replace('https://127\\.0\\.0\\.1:6443', 'https://' ~ lb_ip ~ ':6443') }}"
        dest: "{{ k3s_kubeconfig_local_path | expanduser }}"
        mode: "0600"
      check_mode: no
