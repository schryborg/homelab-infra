---
- name: Install K3s on first master
  hosts: k3s-master1
  become: true
  tags:
    - k3s
  vars:
    k3s_lb_interface: "{{ ansible_facts.default_ipv4.interface }}"
  tasks:
    - name: Install K3s
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server \
                                                         --cluster-init \
                                                         --disable=servicelb \
                                                         --node-taint=CriticalAddonsOnly=true:NoExecute \
                                                         --tls-san=k3s.schryborg.de \
                                                         --tls-san={{ lb_ip }} \
                                                         --write-kubeconfig-mode=644" sh -
      args:
        creates: /etc/systemd/system/k3s.service

    - name: Wait for K3s token file to exist
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120
        state: present

    - name: Get K3s join token
      shell: cat /var/lib/rancher/k3s/server/node-token
      register: k3s_token

    - name: Save token to hostvars
      set_fact:
        join_token: "{{ k3s_token.stdout }}"

    - name: Wait for K3s kubeconfig
      ansible.builtin.wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 120
        state: present

    - name: Deploy kube-vip static pod manifest
      ansible.builtin.template:
        src: templates/kube-vip.yaml.j2
        dest: /var/lib/rancher/k3s/agent/pod-manifests/kube-vip.yaml
        owner: root
        group: root
        mode: "0644"

    - name: Wait for kube-vip VIP to respond
      ansible.builtin.shell: |
        curl -sk https://{{ lb_ip }}:6443/ping
      register: ping_result
      until: ping_result.stdout == "pong"
      retries: 30
      delay: 5

- name: Install K3s on remaining masters
  hosts: "k3s-master2:k3s-master3"
  become: true
  tags:
    - k3s
  vars:
    token: "{{ hostvars['k3s-master1'].join_token }}"
    k3s_lb_interface: "{{ ansible_facts.default_ipv4.interface }}"
  tasks:
    - name: Install K3s
      shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ lb_ip }}:6443 K3S_TOKEN={{ token }} INSTALL_K3S_EXEC="server \
                                                                                                                    --disable=servicelb \
                                                                                                                    --node-taint=CriticalAddonsOnly=true:NoExecute \
                                                                                                                    --tls-san=k3s.schryborg.de \
                                                                                                                    --tls-san={{ lb_ip }} \
                                                                                                                    --write-kubeconfig-mode=644" sh -
      args:
        creates: /etc/systemd/system/k3s.service

    - name: Wait for K3s kubeconfig
      ansible.builtin.wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 120
        state: present

    - name: Deploy kube-vip static pod manifest
      ansible.builtin.template:
        src: templates/kube-vip.yaml.j2
        dest: /var/lib/rancher/k3s/agent/pod-manifests/kube-vip.yaml
        owner: root
        group: root
        mode: "0644"

- name: Install K3s on workers
  hosts: k3s_worker
  become: true
  tags:
    - k3s
  vars:
    token: "{{ hostvars['k3s-master1'].join_token }}"
  tasks:
    - name: Install K3s agent
      shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ lb_ip }}:6443 K3S_TOKEN={{ token }} sh -
      args:
        creates: /etc/systemd/system/k3s-agent.service

- import_playbook: k3s_kubeconfig.yaml
  tags:
    - kubeconfig
